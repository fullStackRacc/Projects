<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css" />
  <title>Playing Cards</title>

</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <p>A</p> 
        <p>♠</p>
      </div>
      <div class="middle">
        <p class="ace">♠</p>
      </div>
      <div class="right">
        A 
        ♠
      </div>
    </div>
    <div class="card red">
      <div class="left">
        3 ♥
      </div>
      <div class="middle">
        <p>♥</p>
        <p>♥</p>
        <p class="reverse">♥</p>
      </div>
      <div class="right">
       3 ♥
      </div>
    </div>
    <div class="card">
      <div class="left">
        2 ♣
      </div>
      <div class="middle">
        <p>♣</p> 
        <div class="grow"></div>
        <p class="reverse">♣</p> 
      </div>
      <div class="right">
        2 ♣
      </div>
    </div>
    <div class="card red">
      <div class="left">
        4 ♦
      </div>
      <div class="middle">
        <div class="group">
        <p>♦</p> <p>♦</p>
        </div> 
        <div class="grow"></div>
        <div class="group">
        <p class="reverse">♦</p> <p class="reverse">♦</p>
        </div>
      </div>
      <div class="right">
       4 ♦
      </div>
    </div>
  </main>
</body>

</html>
